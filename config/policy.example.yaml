# Decision policy. ALL numbers are provisional engineering defaults, not validated investment rules.
# status: PREVIEW until you review and approve (eqm policy approve, then set status: APPROVED).
# FROZEN is required before prospective paper execution. See POLICY.md for every definition.
# market: current-conditions rules (purchase eligibility). They can only pause/block purchases or raise research;
#         they never create ADD/TRIM/EXIT and never relax portfolio limits. pause_on_market_stress is opt-in.
name: provisional-preview
version: 0.1.0
status: PREVIEW
recommendation:
  add_min_margin_of_safety: '0.25'
  add_exit_margin_of_safety: '0.20'
  trim_price_to_base: '1.20'
  trim_release_price_to_base: '1.10'
  exit_price_to_bull: '1.00'
  max_bear_downside: '0.50'
  require_thesis_approval: true
  require_valuation_approval: true
  require_downside_review: true
  max_valuation_age_days: 400
  max_price_age_sessions: 1
  max_filing_check_age_hours: 36
  max_financials_age_days: 200
  next_review_days: 90
  claim_value_tolerance: '0.005'
portfolio:
  target_holdings_min: 10
  target_holdings_max: 15
  max_issuer_weight: '0.10'
  max_sector_weight: '0.30'
  target_position_weight: '0.08'
  min_trade_usd: '50'
  fee_per_trade_usd: '0'
  fractional_shares: true
  cash_buffer_usd: '0'
  allow_borrowing: false
  residual_policy: hold_cash
screening:
  min_fiscal_years: 3
  min_completeness: '0.70'
  min_peer_group_size: 5
  excluded_sic_ranges:
  - - 6000
    - 6199
    - BANK_OR_CREDIT
  - - 6300
    - 6411
    - INSURANCE
  - - 6798
    - 6798
    - REIT
  - - 6770
    - 6770
    - SHELL
  biotech_sic:
  - 2834
  - 2835
  - 2836
  - 8731
  biotech_min_revenue_usd: '100000000'
alerts:
  cooldown_hours: 24
  price_move_alert: '0.10'
paper:
  slippage_bps: '5'
  fee_per_trade_usd: '0'
  fill: next_session_open
valuation:
  explicit_years: 5
  terminal_growth_cap: '0.04'
  default_wacc: '0.09'
  default_terminal_growth: '0.025'
  scenario_growth_shift: '0.04'
  scenario_margin_shift: '0.03'
  scenario_wacc_shift: '0.01'
market:
  enabled: true
  require_exposure_profile_for_purchase: true
  pause_on_adverse_high_exposure: true
  pause_on_unknown_high_exposure: true
  pause_on_market_stress: false
  unreviewed_event_pause_days: 30
  pause_reassess_days: 30
  cluster_window_before_days: 3
  cluster_window_after_days: 10
  stale_daily_days: 7
  stale_monthly_days: 75
  rates_1m_change_pp: '0.50'
  hy_oas_level_pct: '5.0'
  hy_oas_3m_change_pp: '1.0'
  usd_3m_change: '0.05'
  oil_3m_change: '0.25'
  copper_3m_change: '0.20'
  cpi_yoy_high: '0.04'
  unemployment_3m_rise_pp: '0.5'
  indpro_yoy_contraction: '-0.02'
  market_drawdown: '0.10'
  vix_elevated: '30'
  short_interest_days_to_cover_research: '8'
  short_interest_change_research: '0.5'
  valuation_rate_change_proposal_pp: '0.50'
  sector_relative_research: '0.15'
  company_specific_move_research: '0.15'
  stress_wacc_shift: '0.01'
  evaluation_horizon_sessions: 63
  evaluation_min_episodes: 20

finder:                        # discovery of possibly under-rated companies -> RESEARCH candidates only
  protocol_version: finder-protocol-1   # bump when any finder rule changes (evaluation groups by rule hash)
  min_market_cap_usd: '300000000'
  min_daily_dollar_volume_usd: '1000000'   # universe: SINGLE-SESSION proxy; deep dive: trailing median below
  trailing_liquidity_sessions: 20
  peer_mapping: sic-v1          # SIC 4 -> 3 -> 2 digit -> division -> ALL
  exchanges: [NYSE, Nasdaq]
  excluded_industries: [Major Banks, Banks, Commercial Banks, Savings Institutions, Property-Casualty Insurers, Life Insurance,
    Accident &Health Insurance, Specialty Insurers, Real Estate Investment Trusts,
    Trusts Except Educational Religious and Charitable, Finance Companies, Finance/Investors Services,
    Diversified Financial Services, Investment Bankers/Brokers/Service, Blank Checks]
  excluded_sectors: []
  exclude_partnerships: true   # LP/MLP common units (K-1 tax forms)
  countries: [United States]
  min_prelim_metrics: 3
  sector_relative_min_size: 20
  deep_dive_count: 60
  shortlist_size: 25
  min_years_history: 3
  expectations_gap_variable: revenue_growth
  weights: {quality: '0.35', value: '0.30', expectations_gap: '0.35', dcf_margin_of_safety: '0'}   # MoS shown, not weighted (same DCF as the gap)
  max_judgments_per_run: 25
  report_top_priorities: 5
  conservative_gap:             # predeclared, NOT validated; never tune it to today's shortlist
    version: cg-1
    shrink_weight: '0.5'        # growth = 0.5 x own 3y CAGR + 0.5 x peer median ...
    max_excess_over_peer_median: '0.10'   # ... capped at peer median + 10 pp
    min_peer_count: 20
  sensitivity: {wacc_delta: '0.01', terminal_growth_delta: '0.005', margin_relative_delta: '0.10', annual_dilution: '0.01'}
  llm_selection_rule: {verdicts: [RESEARCH_FURTHER], min_priority: 3}   # arm D, applied to the frozen judgments
  evaluation:
    primary_horizon_sessions: 126
    horizons_sessions: [63, 126, 252]
    cost_bps_per_side: '10'
    gate_min_months: 24
    gate_min_primary_cohorts: 52
    max_top5_issuer_share: '0.5'
    bootstrap_samples: 2000
    ci_level: '0.90'
    beta_lookback_sessions: 252

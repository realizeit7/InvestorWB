[project]
name = "equity-monitor"
version = "0.1.0"
description = "Personal long-only fundamental investing research and portfolio decision-support (no trading)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "jinja2>=3.1",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]

[project.scripts]
eqm = "equity_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_monitor"]

[tool.hatch.build.targets.wheel.force-include]
"src/equity_monitor/db/migrations" = "equity_monitor/db/migrations"
"src/equity_monitor/dashboard/templates" = "equity_monitor/dashboard/templates"
"src/equity_monitor/research/selloff/schema.sql" = "equity_monitor/research/selloff/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

{% extends "base.html" %}{% block body %}
<p><a href="/inbox?portfolio={{ pf.name }}&all=1">show acknowledged</a></p>
{% for a in alerts %}<div class="card"><div><b>{{ a.severity }}</b> · {{ a.kind }} · {{ a.created_at[:16] }} · <span class="muted">{{ a.status }}</span></div><h3>{{ a.title }}</h3>
<pre style="white-space:pre-wrap;font:inherit">{{ a.body_md }}</pre>
<form method="post" action="/alerts/ack" style="display:inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="alert_id" value="{{ a.id }}"><input type="hidden" name="back" value="/inbox?portfolio={{ pf.name }}"><button>Acknowledge</button></form>
<form method="post" action="/alerts/snooze" style="display:inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="alert_id" value="{{ a.id }}"><input type="hidden" name="days" value="7"><input type="hidden" name="back" value="/inbox?portfolio={{ pf.name }}"><button>Snooze 7 days</button></form>
</div>{% else %}<div class="card muted">Inbox empty.</div>{% endfor %}
{% endblock %}
